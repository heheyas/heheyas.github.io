  sections:
    summary:
    - I am interested in multimodal generation. Previously, my primary research focused
      on 3D reconstruction and generation. I am a Ph.D student at Department of Computer
      Science and Technology, Tsinghua University, where I am advised by [Prof. Huaping
      Liu](https://sites.google.com/site/thuliuhuaping). Before joining Tsinghua University,
      I completed my undergraduate studies at Xi'an Jiaotong University under the
      supervision of [Prof. Minnan Luo](https://gr.xjtu.edu.cn/web/minnluo), focusing
      on knowledge graphs and their applications in natural language processing.
